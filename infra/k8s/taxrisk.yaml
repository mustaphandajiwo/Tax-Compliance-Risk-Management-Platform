# Reference Kubernetes manifests for a authority-hosted, single-tenant installation.
# Secrets (database URLs, data/token keys, signing key, OIDC settings) come from the state's vault via
# an ExternalSecret or sealed secret named `taxrisk-secrets`; nothing sensitive is stored here.
apiVersion: v1
kind: Namespace
metadata:
  name: taxrisk
  labels: {pod-security.kubernetes.io/enforce: restricted}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: taxrisk-config, namespace: taxrisk}
data:
  TAXRISK_ENVIRONMENT: production
  TAXRISK_DEV_AUTH_ENABLED: "false"
  TAXRISK_REQUIRE_MFA: "true"
  TAXRISK_CELERY_EAGER: "false"
  TAXRISK_STORAGE_BACKEND: s3
  TAXRISK_OUTBOUND_MESSAGING_ENABLED: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: taxrisk-api, namespace: taxrisk}
spec:
  replicas: 2
  selector: {matchLabels: {app: taxrisk-api}}
  template:
    metadata: {labels: {app: taxrisk-api}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        - name: migrate
          image: taxrisk-api:1.0.0
          command: ["taxrisk", "migrate"]
          envFrom: [{configMapRef: {name: taxrisk-config}}, {secretRef: {name: taxrisk-secrets}}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
      containers:
        - name: api
          image: taxrisk-api:1.0.0
          ports: [{containerPort: 8000}]
          envFrom: [{configMapRef: {name: taxrisk-config}}, {secretRef: {name: taxrisk-secrets}}]
          readinessProbe: {httpGet: {path: /readyz, port: 8000}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: 8000}, periodSeconds: 20}
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "2", memory: 2Gi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}, {name: keys, mountPath: /data/keys, readOnly: true}]
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: keys, secret: {secretName: taxrisk-signing-keys}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: taxrisk-worker, namespace: taxrisk}
spec:
  replicas: 1
  selector: {matchLabels: {app: taxrisk-worker}}
  template:
    metadata: {labels: {app: taxrisk-worker}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
          image: taxrisk-api:1.0.0
          command: ["celery", "-A", "taxrisk_api.worker", "worker", "--beat", "--loglevel=info"]
          envFrom: [{configMapRef: {name: taxrisk-config}}, {secretRef: {name: taxrisk-secrets}}]
          resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {cpu: "4", memory: 4Gi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}, {name: keys, mountPath: /data/keys, readOnly: true}]
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: keys, secret: {secretName: taxrisk-signing-keys}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: taxrisk-web, namespace: taxrisk}
spec:
  replicas: 2
  selector: {matchLabels: {app: taxrisk-web}}
  template:
    metadata: {labels: {app: taxrisk-web}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: web
          image: taxrisk-web:1.0.0
          ports: [{containerPort: 3000}]
          readinessProbe: {httpGet: {path: /, port: 3000}}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: taxrisk-api, namespace: taxrisk}
spec: {selector: {app: taxrisk-api}, ports: [{port: 80, targetPort: 8000}]}
---
apiVersion: v1
kind: Service
metadata: {name: taxrisk-web, namespace: taxrisk}
spec: {selector: {app: taxrisk-web}, ports: [{port: 80, targetPort: 3000}]}
---
# Default-deny; only the ingress controller reaches web/api, and only api/worker reach the data tier.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: taxrisk}
spec: {podSelector: {}, policyTypes: [Ingress, Egress]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-ingress-to-edge, namespace: taxrisk}
spec:
  podSelector: {matchExpressions: [{key: app, operator: In, values: [taxrisk-api, taxrisk-web]}]}
  policyTypes: [Ingress]
  ingress:
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-app-egress, namespace: taxrisk}
spec:
  podSelector: {matchExpressions: [{key: app, operator: In, values: [taxrisk-api, taxrisk-worker]}]}
  policyTypes: [Egress]
  egress:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: taxrisk-data}}}]
      ports: [{port: 5432}, {port: 6379}, {port: 9000}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: taxrisk-identity}}}]
      ports: [{port: 8080}, {port: 443}]
    - ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
