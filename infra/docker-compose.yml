# Local / pilot-sandbox stack. Synthetic data only. Secrets here are DEV placeholders —
# real deployments inject them from the state-controlled secrets vault.
name: taxcris
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: taxcris
      POSTGRES_PASSWORD: taxcris
      POSTGRES_DB: taxcris
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxcris"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: .., dockerfile: infra/Dockerfile.api }
    environment: &api_env
      TAXCRIS_DATABASE_URL: postgresql+psycopg://taxcris:taxcris@db:5432/taxcris
      TAXCRIS_JWT_SECRET: ${TAXCRIS_JWT_SECRET:-dev-only-change-me-0123456789abcdef}
      TAXCRIS_INLINE_JOBS: "false"
      TAXCRIS_AS_OF: ${TAXCRIS_AS_OF:-2026-10-21}
      TAXCRIS_CORS_ORIGINS: '["http://localhost:3000"]'
    command: sh -c "alembic upgrade head && taxcris-seed"
    depends_on: { db: { condition: service_healthy } }

  api:
    build: { context: .., dockerfile: infra/Dockerfile.api }
    environment: *api_env
    ports: ["8000:8000"]
    depends_on: { migrate: { condition: service_completed_successfully } }

  worker-ingestion:
    build: { context: .., dockerfile: infra/Dockerfile.api }
    environment: *api_env
    command: taxcris-worker --queue ingestion
    depends_on: { migrate: { condition: service_completed_successfully } }

  worker-risk:
    build: { context: .., dockerfile: infra/Dockerfile.api }
    environment: *api_env
    command: taxcris-worker --queue risk
    depends_on: { migrate: { condition: service_completed_successfully } }

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args: { NEXT_PUBLIC_API_URL: "http://localhost:8000" }
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
