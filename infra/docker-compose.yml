# NGSIRS CRM local stack (SYNTHETIC DATA ONLY).
#   docker compose -f infra/docker-compose.yml up --build
# Then: docker compose -f infra/docker-compose.yml exec api ngsirs demo
# Web console http://localhost:3000, API http://localhost:8000/docs, Keycloak http://localhost:8080
#
# The demo profile uses the built-in development token issuer. To exercise OIDC + MFA via Keycloak instead,
# set NGSIRS_DEV_AUTH_ENABLED=false, NGSIRS_REQUIRE_MFA=true and
# NGSIRS_OIDC_JWKS_URL=http://keycloak:8080/realms/ngsirs/protocol/openid-connect/certs,
# NGSIRS_OIDC_ISSUER=http://localhost:8080/realms/ngsirs on the api and worker services.

x-api-env: &api-env
  NGSIRS_ENVIRONMENT: demo
  NGSIRS_DATABASE_URL: postgresql+psycopg://ngsirs_app:ngsirs_app@postgres:5432/ngsirs
  NGSIRS_OWNER_DATABASE_URL: postgresql+psycopg://ngsirs_owner:ngsirs_owner@postgres:5432/ngsirs
  NGSIRS_REDIS_URL: redis://redis:6379/0
  NGSIRS_CELERY_EAGER: "false"
  NGSIRS_STORAGE_BACKEND: s3
  NGSIRS_S3_ENDPOINT: http://minio:9000
  NGSIRS_S3_BUCKET: ngsirs-raw
  NGSIRS_S3_ACCESS_KEY: ngsirs-demo
  NGSIRS_S3_SECRET_KEY: ngsirs-demo-secret
  NGSIRS_SIGNING_KEY_PATH: /data/keys/evidence_ed25519.pem
  NGSIRS_JWT_KEY_PATH: /data/keys/dev_jwt_rsa.pem
  NGSIRS_OTEL_EXPORTER_ENDPOINT: http://otel-collector:4318/v1/traces
  NGSIRS_CORS_ORIGINS: http://localhost:3000

services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_PASSWORD: postgres-local-only
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
      - ./db/create-db.sql:/docker-entrypoint-initdb.d/01-db.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 20
    ports: ["5432:5432"]

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ngsirs-demo
      MINIO_ROOT_PASSWORD: ngsirs-demo-secret
    volumes: [miniodata:/data]
    ports: ["9001:9001"]

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on: [minio]
    entrypoint: >
      sh -c "sleep 3 && mc alias set local http://minio:9000 ngsirs-demo ngsirs-demo-secret &&
             mc mb --ignore-existing local/ngsirs-raw && mc encrypt set sse-s3 local/ngsirs-raw || true"

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin-local-only
    volumes:
      - ./keycloak/ngsirs-realm.json:/opt/keycloak/data/import/ngsirs-realm.json:ro
    ports: ["8080:8080"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otel/collector.yaml"]
    volumes: [./otel/collector.yaml:/etc/otel/collector.yaml:ro]

  api:
    build: {context: .., dockerfile: infra/docker/api.Dockerfile}
    environment: *api-env
    command: sh -c "ngsirs migrate && uvicorn ngsirs_api.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    volumes: [keys:/data/keys]
    ports: ["8000:8000"]

  worker:
    build: {context: .., dockerfile: infra/docker/api.Dockerfile}
    environment: *api-env
    command: celery -A ngsirs_api.worker worker --beat --loglevel=info
    depends_on: [api]
    volumes: [keys:/data/keys]

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args: {NEXT_PUBLIC_API_URL: "http://localhost:8000"}
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  pgdata: {}
  miniodata: {}
  keys: {}
