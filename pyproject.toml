[project]
name = "ngsirs-crm"
version = "0.1.0"
description = "NGSIRS Compliance Risk Management Platform - API, risk engine and importer"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyjwt[crypto]>=2.8",
  "cryptography>=42",
  "openpyxl>=3.1",
  "python-multipart>=0.0.9",
  "celery>=5.4",
  "redis>=5.0",
  "boto3>=1.34",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5",
  "httpx>=0.27",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
ngsirs = "ngsirs_api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "apps/api/ngsirs_api",
  "services/risk_engine/risk_engine",
  "services/importer/importer",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "-q"
markers = ["integration: requires PostgreSQL"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4"]
ignore = ["S101", "B008", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"fixtures/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
packages = ["risk_engine", "importer", "ngsirs_api"]

[tool.hatch.build]
dev-mode-dirs = ["apps/api", "services/risk_engine", "services/importer"]

[tool.ruff.lint.isort]
known-first-party = ["ngsirs_api", "risk_engine", "importer"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120
