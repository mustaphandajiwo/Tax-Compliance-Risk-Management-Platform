[project]
name = "taxcris"
version = "0.1.0"
description = "TaxCRIS — Integrated Compliance Risk Management & Intelligence Platform (API + workers)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pyjwt>=2.8",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
taxcris-seed = "taxcris.seed:main"
taxcris-worker = "taxcris.jobs:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["taxcris*"]

[tool.pytest.ini_options]
testpaths = ["tests", "../../tests/acceptance"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["F", "E9", "B"]
# Mapping domain exceptions to HTTPException inside `except` is intentional.
ignore = ["B904"]
